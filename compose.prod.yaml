# Production stack for OmniBot.
#
# This file deploys *published* images — it does not build anything, so the
# host needs nothing but Docker, this file and an env file:
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose --env-file .env.prod -f compose.prod.yaml pull
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d
#
# Both images track `latest`, so deploying a release is always the same two
# commands and an automated deploy needs no edit on the host. `latest` only ever
# moves to a non-prerelease tag, so publishing a `-rc` does not deploy it.
# To build and run the images locally instead, use `docker build --target
# runtime .` — the CI builds both targets on every pull request.

name: omnibot

# journald, not json-file: every deploy recreates the bot's container, and
# json-file deletes the logs with the container they belong to. The journal
# keeps them on the host across deploys, within its own retention
# (SystemMaxUse, MaxRetentionSec in journald.conf). The host must run
# systemd-journald, or the containers do not start.
x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # PostgreSQL is reachable only from the internal network: no published port.
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    # Pinned by digest, so the image on the host is either this exact one or
    # absent: no need to ask Docker Hub again on every redeploy, which counts
    # against its pull rate limit. A digest bumped by Renovate is absent, so it
    # is pulled; the `latest` images below keep the default and are refreshed.
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  # One-shot init container: applies the Prisma migration history, then exits.
  # It carries the Prisma CLI, which the bot image deliberately does not, and
  # it is pinned to the same version as the bot so the schema the migrations
  # produce is the one the code expects.
  migrate:
    image: ghcr.io/gravendev/omnibot-migrator:latest
    restart: "no"
    environment:
      DATABASE_URL: &database_url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

  bot:
    image: ghcr.io/gravendev/omnibot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      DATABASE_URL: *database_url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      # `internal` reaches PostgreSQL, `egress` reaches the Discord gateway.
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No healthcheck: the bot exposes no HTTP/TCP endpoint; it pushes its
    # health to Uptime Kuma instead — see the Deployment section of README.md.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

networks:
  # No route to the outside world: only the bot bridges the two networks.
  internal:
    internal: true
  egress: {}

volumes:
  postgres_data:
