# Git hooks, managed by lefthook (replaces husky + lint-staged).
# Run `lefthook install` after cloning (the `prepare` npm script does this).

pre-commit:
  parallel: true
  commands:
    code:
      glob: "*.{js,mjs,cjs,ts,mts,cts}"
      run: pnpm exec oxfmt --check {staged_files} && pnpm exec oxlint --deny-warnings {staged_files}
    docs:
      glob: "*.{md,json}"
      run: pnpm exec oxfmt --check {staged_files}
    # dlx follows the workspace trustPolicy, which rejects some old, legitimate
    # releases deep in Renovate's dependency tree (semver@6.3.1). Releases
    # over 30 days old are spared for this tool only; recent ones are checked.
    renovate:
      glob: ".renovaterc.json"
      run: pnpm --config.trust-policy-ignore-after=43200 --package=renovate dlx renovate-config-validator --strict {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
