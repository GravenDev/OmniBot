name: CI & Release

on:
  push:
    branches: ["master"]
    # `v*` also matched any tag starting with a "v" — `vtest`, `vendor-freeze`.
    # A release run should only start for something version-shaped.
    tags: ["v[0-9]*"]
  pull_request:
  # Lets a release be re-run from the tag once the cause of a failed publish is
  # fixed, without moving the tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch run is worth cancelling; a release is not — cancelling
  # one mid-push leaves a half-written manifest on the registry.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check code format
        run: pnpm exec oxfmt --check .
      - name: Run linter
        run: pnpm exec oxlint --deny-warnings

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 only here: `publish` builds arm64 on its own runner. Each build gets its own cache scope — they would otherwise overwrite one
      # another's manifest, since `mode=max` writes one per scope.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: omnibot:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime
      # Shares every layer up to `deps` with the step above, so this is cheap —
      # but it is what catches a break in the migration image, which the compose
      # stack needs before the bot may start.
      - name: Build the migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: false
          load: true
          tags: omnibot-migrator:ci
          cache-from: type=gha,scope=ci-migrator
          cache-to: type=gha,mode=max,scope=ci-migrator
      # Building is not enough: a CMD pointing at a missing file builds fine and
      # only fails at start. Apply the migrations, then start the bot with a
      # dummy token — reaching Discord's token check proves the whole import
      # graph loads from the production image.
      - name: Smoke-test the images
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=ci postgres:17.11-alpine
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          url=postgresql://postgres:ci@pg:5432/postgres
          docker run --rm --network smoke -e DATABASE_URL=$url omnibot-migrator:ci
          set +e
          out=$(timeout 60 docker run --rm --network smoke -e DISCORD_TOKEN=ci -e DATABASE_URL=$url omnibot:ci 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q TokenInvalid

  # Publishing lives in this workflow rather than its own so it can depend on the
  # checks: a separate workflow triggered by the same tag would run *beside*
  # them, and could push an image whose lint or tests had just failed.
  publish:
    needs: [lint, build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Name the images
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # `latest` is not listed: the default `latest=auto` flavor already adds it
      # for a non-prerelease semver tag, and only for one.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The tag filter cannot express semver, so a tag like `v1.2.x` or
      # `v2-final` still reaches this job, and `type=semver` emits nothing for
      # it. The manifest could then not be tagged, minutes in and pointing
      # nowhere near the cause. Refuse here instead, before the build, and say
      # why.
      - name: Fail if the tag produced no image tag
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::${{ github.ref_name }} is not a valid semver tag, so no image tag could be derived. Tag a release as v<major>.<minor>.<patch> (a prerelease such as v0.0.1-rc1 is fine for testing)."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reads the amd64 layers the `docker` job just built, when the Actions
      # cache makes them reachable from this ref, and keeps its own cache per
      # architecture in a separate scope.
      - name: Build and push the bot image
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=release-${{ matrix.arch }}
            type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # The migrator ships as its own package, under the same tags as the bot:
      # a deployment pulls the pair for one version, and the migration history
      # can never drift from the code that expects it.
      - name: Build and push the migrator image
        id: migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }}-migrator,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=release-migrator-${{ matrix.arch }}
            type=gha,scope=ci-migrator
          cache-to: type=gha,mode=max,scope=release-migrator-${{ matrix.arch }}

      - name: Export the digests
        run: |
          mkdir -p digests/runtime digests/migrator
          touch "digests/runtime/${RUNTIME#sha256:}" "digests/migrator/${MIGRATOR#sha256:}"
        env:
          RUNTIME: ${{ steps.runtime.outputs.digest }}
          MIGRATOR: ${{ steps.migrator.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Name the images
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch manifests
        run: |
          for target in runtime migrator; do
            name=$IMAGE
            [ "$target" = migrator ] && name=$IMAGE-migrator
            args=()
            for tag in $TAGS; do
              args+=(--tag "$name:${tag##*:}")
            done
            sources=()
            for digest in "digests/$target"/*; do
              sources+=("$name@sha256:${digest##*/}")
            done
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$name:$VERSION"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}

  # The stack is defined in Portainer against this repository; the webhook only
  # asks it to redeploy, which re-pulls `latest`. Unlike an SSH deploy key, the
  # secret it needs grants no shell on the host and can do nothing but this.
  deploy:
    needs: manifest
    # A prerelease publishes its image but does not move `latest`, so redeploying
    # on one would restart the stack onto the version already running — a
    # deployment that reports success and changes nothing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # -f makes an HTTP error a non-zero exit: without it curl reports success
      # on a 404, and a webhook that has been revoked or renamed would look like
      # a successful deployment for as long as nobody checked the bot.
      - name: Trigger the Portainer stack redeploy
        run: curl -fsS --max-time 300 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
