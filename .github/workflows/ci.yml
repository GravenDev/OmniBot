name: CI & Release

on:
  push:
    branches: ["master"]
    # `v*` also matched any tag starting with a "v" — `vtest`, `vendor-freeze`.
    # A release run should only start for something version-shaped.
    tags: ["v[0-9]*"]
  pull_request:
  # Lets a release be re-run from the tag once the cause of a failed publish is
  # fixed, without moving the tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch run is worth cancelling; a release is not — cancelling
  # one mid-push leaves a half-written manifest on the registry.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node and pnpm at the versions pinned in .mise.toml; the other tools
      # listed there (pitchfork, gh) are only for local development.
      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm
      # No node-version: setup-node keeps the Node mise put on the PATH and is
      # only here for its pnpm store cache.
      - name: Cache the pnpm store
        uses: actions/setup-node@v6
        with:
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci
      - name: Check code format
        run: pnpm exec oxfmt --check .
      - name: Run linter
        run: pnpm exec oxlint --deny-warnings

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node and pnpm at the versions pinned in .mise.toml; the other tools
      # listed there (pitchfork, gh) are only for local development.
      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm
      # No node-version: setup-node keeps the Node mise put on the PATH and is
      # only here for its pnpm store cache.
      - name: Cache the pnpm store
        uses: actions/setup-node@v6
        with:
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm test

  # Both architectures the release ships, each on a native runner: a break that
  # only shows on arm64 (a native dependency, the musl-arm64 Prisma engine)
  # surfaces on the pull request instead of on the tag.
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both images in one bake call (docker-bake.hcl): the stages they share
      # are solved once. Only the runtime image exports the cache — with
      # `mode=max` it holds every stage the migrator is built from too, and a
      # second export to the same scope would overwrite the first, since there
      # is one manifest per scope. The migration image is still built: it is
      # what the compose stack needs before the bot may start.
      - name: Build the images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          load: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=ci-${{ matrix.arch }}
            runtime.cache-to=type=gha,mode=max,scope=ci-${{ matrix.arch }}
            runtime.tags=omnibot:ci
            migrator.tags=omnibot-migrator:ci
      # Building is not enough: a CMD pointing at a missing file builds fine and
      # only fails at start. Apply the migrations, then start the bot with a
      # dummy token — reaching Discord's token check proves the whole import
      # graph loads from the production image.
      - name: Smoke-test the images
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=ci postgres:17.11-alpine
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          url=postgresql://postgres:ci@pg:5432/postgres
          docker run --rm --network smoke -e DATABASE_URL=$url omnibot-migrator:ci
          set +e
          out=$(timeout 60 docker run --rm --network smoke -e DISCORD_TOKEN=ci -e DATABASE_URL=$url omnibot:ci 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q TokenInvalid

  # Publishing lives in this workflow rather than its own so it can depend on the
  # checks: a separate workflow triggered by the same tag would run *beside*
  # them, and could push an image whose lint or tests had just failed.
  #
  # Each platform builds on a runner of its own architecture — no QEMU — and
  # pushes its images by digest only, untagged. `merge` then assembles the
  # multi-arch manifests and tags them: a single buildx call can only do both
  # at once when it builds every platform itself.
  publish:
    needs: [lint, build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GHCR rejects upper case, and `github.repository` is GravenDev/OmniBot.
      # metadata-action lowercases the names it tags, but a push by digest
      # takes the name as written.
      - name: Prepare
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo "IMAGE=$image"
            echo "MIGRATOR_IMAGE=$image-migrator"
          } >> "$GITHUB_ENV"

      # Only the labels go on the images here, through the bake file this writes;
      # `merge` derives the same tags again to name the manifests.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The tag filter cannot express semver, so a tag like `v1.2.x` or
      # `v2-final` still reaches this job, and `type=semver` emits nothing for
      # it. `merge` would then have no tag to give the manifest, after both
      # builds. Refuse here instead, before the build, and say why.
      - name: Fail if the tag produced no image tag
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::${{ github.ref_name }} is not a valid semver tag, so no image tag could be derived. Tag a release as v<major>.<minor>.<patch> (a prerelease such as v0.0.1-rc1 is fine for testing)."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `docker` job of this very run just built the same images for this
      # architecture and exported their cache, so this build is mostly cache
      # hits. Nothing is exported here: that cache is already there.
      #
      # The migrator ships as its own package, under the same tags as the bot:
      # a deployment pulls the pair for one version, and the migration history
      # can never drift from the code that expects it.
      - name: Build and push the images
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=ci-${{ matrix.arch }}
            runtime.tags=
            migrator.tags=
            runtime.output=type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
            migrator.output=type=image,name=${{ env.MIGRATOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # One empty file per digest, named after it: `merge` lists the folder.
      - name: Export the digests
        run: |
          for target in runtime migrator; do
            digest=$(jq -er --arg t "$target" '.[$t]["containerimage.digest"]' <<< "$METADATA")
            mkdir -p "$RUNNER_TEMP/digests/$target"
            touch "$RUNNER_TEMP/digests/$target/${digest#sha256:}"
          done
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}

      - name: Upload the digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags only once every platform is pushed: a tag never points at a manifest
  # that is missing an architecture.
  merge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo "IMAGE=$image"
            echo "MIGRATOR_IMAGE=$image-migrator"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is not listed: the default `latest=auto` flavor already adds it
      # for a non-prerelease semver tag, and only for one.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata for the migrator
        id: meta-migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.MIGRATOR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-arch manifests
        run: |
          merge() { # <image> <digests dir> <metadata json>
            local image=$1 dir=$2 json=$3
            # shellcheck disable=SC2046 # one word per tag and per digest
            docker buildx imagetools create \
              $(jq -r '.tags[] | "-t " + .' <<< "$json") \
              $(cd "$dir" && printf "$image@sha256:%s " *)
            docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$json")"
          }
          merge "$IMAGE" "$RUNNER_TEMP/digests/runtime" "$BOT_META"
          merge "$MIGRATOR_IMAGE" "$RUNNER_TEMP/digests/migrator" "$MIGRATOR_META"
        env:
          BOT_META: ${{ steps.meta.outputs.json }}
          MIGRATOR_META: ${{ steps.meta-migrator.outputs.json }}

  # The stack is defined in Portainer against this repository; the webhook only
  # asks it to redeploy, which re-pulls `latest`. Unlike an SSH deploy key, the
  # secret it needs grants no shell on the host and can do nothing but this.
  deploy:
    needs: merge
    # A prerelease publishes its image but does not move `latest`, so redeploying
    # on one would restart the stack onto the version already running — a
    # deployment that reports success and changes nothing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # -f makes an HTTP error a non-zero exit: without it curl reports success
      # on a 404, and a webhook that has been revoked or renamed would look like
      # a successful deployment for as long as nobody checked the bot.
      - name: Trigger the Portainer stack redeploy
        run: curl -fsS --max-time 300 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
