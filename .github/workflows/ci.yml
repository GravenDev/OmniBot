name: CI & Release

on:
  push:
    branches: ["master"]
    # `v*` also matched any tag starting with a "v" — `vtest`, `vendor-freeze`.
    # A release run should only start for something version-shaped.
    tags: ["v[0-9]*"]
  pull_request:
  # Lets a release be re-run from the tag once the cause of a failed publish is
  # fixed, without moving the tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch run is worth cancelling; a release is not — cancelling
  # one mid-push leaves a half-written manifest on the registry.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Blacksmith only where it pays: its builder keeps the Docker layer cache on
  # disk, which cut the image builds from about 60 s to 12 s. Everything else
  # ran as fast on GitHub's runners, free for a public repository. Two vCPUs: a
  # cached build waits on the disk more than on the CPU. The tests do not: they
  # took 30 s there against 20 s on GitHub's four, so `build` stays on GitHub.
  # With both kinds of runner in this workflow, every job names Ubuntu 26.04
  # rather than `ubuntu-latest`: they all run on the same system, whichever side
  # they land on.
  lint:
    runs-on: ubuntu-26.04
    permissions: &read-only
      contents: read

    steps:
      # Two commits deep: the copy check compares a pull request's merge
      # commit with its first parent, the base branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check that mise and the Docker image run the same Node
        run: |
          mise=$(sed -nE 's/^node = "([^"]+)"$/\1/p' .mise.toml)
          image=$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9.]+)-.*/\1/p' Dockerfile)
          if [ -z "$mise" ] || [ "$mise" != "$image" ]; then
            echo "::error::Node ${mise:-?} in .mise.toml but ${image:-?} in the Dockerfile: they must match"
            exit 1
          fi
      - uses: $/.github/actions/setup
      - name: Check code format
        run: pnpm exec oxfmt --check .
      - name: Run linter
        run: pnpm exec oxlint --deny-warnings
      # Only what the pull request adds: the copies already on master are
      # listed by the subsystem review, not refused here.
      - name: Check for code copied between modules
        if: github.event_name == 'pull_request'
        run: node scripts/copy-check.ts HEAD^1

  # Pull requests are merged by rebase: each commit becomes a line of the
  # release's changelog. Their subjects follow commitlint.config.js, as the
  # commit-msg hook checks locally, which --no-verify skips.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions: *read-only

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup
      # The merge commit's parents, as the copy check takes them: exactly the
      # commits the merge adds, whatever base the event payload carries.
      - name: Check the commit messages
        run: pnpm exec commitlint --from HEAD^1 --to HEAD^2 --verbose

  # The changelog lines a pull request will add, as a comment on it, updated
  # on every push: a fix hidden in a chore, or a title naming a work step,
  # shows there before the merge. No dependency is installed: only git-cliff
  # runs, with the pull request's own cliff.toml and .mise.toml. The write
  # token goes to a pull request from this repository only, whose author can
  # already change this workflow; a fork's preview stays in the job summary.
  changelog-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up git-cliff
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: git-cliff
          cache: false
      - name: Preview the changelog
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- changelog-preview -->'
          lines=$(git cliff --config cliff.toml -- HEAD^1..HEAD^2)
          body=$(printf '%s\n## Aperçu du changelog\n\nLes lignes que cette pull request ajoutera aux notes de la prochaine release, une par commit :\n%s\n' "$marker" "${lines:-_Aucune._}")
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SAME_REPO" != true ]; then exit 0; fi
          # Only this workflow's own comment: the token cannot edit anyone
          # else's, and a copied marker must not break the job.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" |
            sed -n 1p)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  build:
    runs-on: ubuntu-26.04
    permissions: *read-only

    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Build
        run: pnpm build
      # Coverage only where the sonarcloud job reads it: not on tags, which
      # it skips, so a release does not wait on the instrumentation.
      - name: Run tests
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm test
      - name: Run tests with coverage
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm test:coverage
      # A missing report fails here rather than reaching SonarCloud as 0 %
      # coverage: the upload below would still find src/generated/.
      - name: Check the coverage report
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: test -s coverage/lcov.info
      # The coverage report, and the generated Prisma client for its types.
      # Kept in this repository only, where the sonarcloud job reads them.
      - name: Keep what SonarCloud needs
        if: github.repository == 'GravenDev/OmniBot' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: sonarcloud-inputs
          if-no-files-found: error
          path: |
            coverage/lcov.info
            src/generated/
          # Long enough to re-run the analysis alone after a SonarCloud outage.
          retention-days: 7

  # SonarCloud, in a job of its own for two reasons. Its token never shares a
  # job with the project's dependencies, which `build` installs and runs: a
  # malicious package there could redirect the analysis and take the token.
  # And no release waits on it (`publish` does not need it): SonarCloud down
  # or a token expired must not hold back a tag. Only in this repository: a
  # fork has no token, whether through its pull request here or a push to its
  # own branches. Skipped on tags too.
  sonarcloud:
    needs: build
    if: >-
      github.repository == 'GravenDev/OmniBot' &&
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions: *read-only

    steps:
      # The whole history: SonarCloud tells new code from old by it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The dependencies are installed for their type declarations only:
      # without them, the analysis reads every discord.js or Node type as
      # `any`. --ignore-scripts, and nothing of the project is run, so no
      # package code executes in the job that holds the token.
      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm
          cache: false
      # The bot's own dependencies only, not the docs site or the migrator.
      - name: Install the dependencies without running them
        run: pnpm install --frozen-lockfile --ignore-scripts --filter omni-bot
      - uses: actions/download-artifact@v8
        with:
          name: sonarcloud-inputs
      # The last release, from the tags: releases are tags, and package.json
      # carries no version. The tag, not `git describe` in full: a version
      # that changed with every commit would restart SonarCloud's "new code"
      # period each time.
      - name: Find the last release
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      # Reads coverage/lcov.info and sonar-project.properties.
      - name: Analyse with SonarCloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}

  # Checks every version in the lockfile, dev dependencies included, against
  # OSV's malicious-packages advisories (`MAL-…`): versions published to do
  # harm — a hijacked account, a typosquat — that the pnpm release age did not
  # keep out. This is what gates the automerged lockfile maintenance, as a
  # required check of master: GitHub's automerge waits for no other. Known
  # vulnerabilities are not this job's: their fixes are taken by hand (see
  # pnpm-workspace.yaml), Trivy scans the images, and they are never printed:
  # the log of a public repository is readable by anyone, while a malicious
  # package is public knowledge already.
  malware:
    runs-on: ubuntu-26.04
    permissions: *read-only

    steps:
      - *checkout
      - name: Set up osv-scanner
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: osv-scanner
          cache: false
      # Exit status 1 only means something was found; anything above is a scan
      # that did not complete, and must not pass for a clean one. A malicious
      # version may come back under another id (a GHSA) with its `MAL-` id
      # among the aliases: both are matched.
      #
      # osv-scanner reads an osv-scanner.toml next to the lockfile, whose ignore
      # entries would hide a malicious version: an empty config overrides it.
      - name: Check the lockfile for malicious packages
        run: |
          config=$(mktemp)
          status=0
          osv-scanner scan source --config "$config" --lockfile pnpm-lock.yaml --format json --output-file osv.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::osv-scanner failed with status $status"
            exit 1
          fi
          malicious=$(jq -r '[.results[]?.packages[]? | .package as $p
            | .vulnerabilities[]? | .id, .aliases[]? | select(startswith("MAL-"))
            | "\($p.name)@\($p.version): \(.)"] | unique[]' osv.json)
          if [ -n "$malicious" ]; then
            echo "::error::Malicious package versions in pnpm-lock.yaml"
            echo "$malicious"
            exit 1
          fi

  docker:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions: *read-only

    steps:
      - *checkout
      - &setup-buildx
        name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: omnibot/images
      # amd64 only, like the release: the Portainer host is amd64, and nothing
      # consumes an arm64 image.
      #
      # One cache scope for both images, exported by the runtime target alone:
      # with `mode=max` it holds every stage the migrator is built from too, and
      # a second export to the same scope would overwrite the first, since there
      # is one manifest per scope.
      #
      # The migrator image is what catches a break in the migration image, which
      # the compose stack needs before the bot may start.
      - name: Build the runtime and migrator images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=ci
            runtime.tags=omnibot:ci
            migrator.tags=omnibot-migrator:ci
            ${{ github.event_name == 'push' && 'runtime.cache-to=type=gha,mode=max,scope=ci' || '' }}
      # Building is not enough: a CMD pointing at a missing file builds fine and
      # only fails at start. Apply the migrations, then start the bot with a
      # dummy token — reaching Discord's token check proves the whole import
      # graph loads from the production image.
      - name: Smoke-test the images
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=ci postgres:17.11-alpine
          until docker exec pg pg_isready -U postgres; do sleep 1; done
          url=postgresql://postgres:ci@pg:5432/postgres
          docker run --rm --network smoke -e DATABASE_URL=$url omnibot-migrator:ci
          set +e
          out=$(timeout 60 docker run --rm --network smoke -e DISCORD_TOKEN=ci -e DATABASE_URL=$url omnibot:ci 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q TokenInvalid

  # Publishing lives in this workflow rather than its own so it can depend on the
  # checks: a separate workflow triggered by the same tag would run *beside*
  # them, and could push an image whose lint or tests had just failed.
  publish:
    needs: [lint, build, docker, malware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - *checkout

      # `latest` is not listed: the default `latest=auto` flavor already adds it
      # for a non-prerelease semver tag, and only for one.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The tag filter cannot express semver, so a tag like `v1.2.x` or
      # `v2-final` still reaches this job, and `type=semver` emits nothing for
      # it. buildx would then fail with "tag is needed when pushing to
      # registry", ten minutes in and pointing nowhere near the cause. Refuse
      # here instead, before the build, and say why.
      - name: Fail if the tag produced no image tag
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::$GITHUB_REF_NAME is not a valid semver tag, so no image tag could be derived. Tag a release as v<major>.<minor>.<patch> (a prerelease such as v0.0.1-rc1 is fine for testing)."
          exit 1

      - *setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `docker` job of this very run just built the same images and
      # exported their cache, so this is mostly a push. Nothing is exported
      # here: that cache is already there.
      - name: Build and push the bot image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The migrator ships as its own package, under the same tags as the bot:
      # a deployment pulls the pair for one version, and the migration history
      # can never drift from the code that expects it.
      - name: Extract metadata for the migrator
        id: meta-migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the migrator image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}

  # The stack is defined in Portainer against this repository; the webhook only
  # asks it to redeploy, which re-pulls `latest`. Unlike an SSH deploy key, the
  # secret it needs grants no shell on the host and can do nothing but this.
  deploy:
    needs: publish
    # A prerelease publishes its image but does not move `latest`, so redeploying
    # on one would restart the stack onto the version already running — a
    # deployment that reports success and changes nothing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-26.04
    permissions: {}

    steps:
      # -f makes an HTTP error a non-zero exit: without it curl reports success
      # on a 404, and a webhook that has been revoked or renamed would look like
      # a successful deployment for as long as nobody checked the bot.
      - name: Trigger the Portainer stack redeploy
        run: curl -fsS --max-time 300 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

  # Scans the new `latest` right away rather than at the next weekly run. The
  # scan runs on master, through a dispatch, so that its alerts land on the
  # default branch — uploaded from this tag run, they would sit on the tag.
  # Same condition as `deploy`: a prerelease does not move `latest`.
  scan:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Dispatch the Trivy scan
        run: gh workflow run trivy.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ github.token }}

  # The notes of the GitHub Release: the image references by digest, the
  # changelog since the previous release (git-cliff, cliff.toml), the
  # vulnerabilities of the dependencies the release fixes (osv-scanner on the
  # lockfile of both tags; only fixed ones are printed, never one the release
  # brings in, the log being public) and, above them, a summary for server
  # admins written by an AI model, through any
  # OpenAI-compatible Chat Completions API: the AI_API_KEY secret, the AI_MODEL
  # variable and, for another provider than OpenAI, the AI_BASE_URL variable.
  # Without the key or the model, or when the call fails, the notes go out
  # without the summary. See scripts/release-notes.ts.
  #
  # Kept apart from the job that writes the release: the API key never shares
  # a job with a token that can write to the repository. The commit titles fed
  # to the model only travel through files and the API request, never through
  # a `run:` line. No dependency is installed and no cache restored: a job
  # holding a secret on a tag run runs nothing a branch could have written.
  release-notes:
    needs: publish
    runs-on: ubuntu-26.04
    # The AI_API_KEY secret lives in this environment, which only `v*` tags may
    # use: a workflow edited on a branch cannot read it.
    environment: release
    permissions: *read-only

    steps:
      # The whole history and the tags: the range starts at the previous one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # osv-scanner at the version the malware job runs, pinned in .mise.toml.
      - name: Set up Node.js, git-cliff and osv-scanner
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node git-cliff osv-scanner
          cache: false

      - name: Write the release notes
        run: node scripts/release-notes.ts --tag "$GITHUB_REF_NAME" --out release-notes.md
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  # Creates the release of the tag, or replaces its notes when it exists — a
  # re-run from the tag. `--verify-tag` makes gh fail rather than create a tag.
  # A tag with a `-` is a prerelease, like the images: `latest` does not move.
  release:
    needs: release-notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write # creates the release, or edits its notes

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create or update the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            prerelease=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${prerelease[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
