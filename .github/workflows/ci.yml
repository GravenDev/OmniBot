name: CI & Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
  # Lets a release be re-run from the tag once the cause of a failed publish is
  # fixed, without moving the tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch run is worth cancelling; a release is not — cancelling
  # one mid-push leaves a half-written manifest on the registry.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - name: Read Node version from .mise.toml
        id: node-version
        run: echo "version=$(grep '^node = ' .mise.toml | sed 's/node = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci
      - name: Check code format
        run: pnpm exec oxfmt --check .
      - name: Run linter
        run: pnpm exec oxlint --deny-warnings

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - name: Read Node version from .mise.toml
        id: node-version
        run: echo "version=$(grep '^node = ' .mise.toml | sed 's/node = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      # amd64 only here: the arm64 half of the release build runs under QEMU and
      # is far too slow to sit on every pull request. `publish` covers both.
      # Each build gets its own cache scope — they would otherwise overwrite one
      # another's manifest, since `mode=max` writes one per scope.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          tags: omnibot:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime
      # Shares every layer up to `deps` with the step above, so this is cheap —
      # but it is what catches a break in the migration image, which the compose
      # stack needs before the bot may start.
      - name: Build the migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: false
          tags: omnibot-migrator:ci
          cache-from: type=gha,scope=ci-migrator
          cache-to: type=gha,mode=max,scope=ci-migrator

  # Publishing lives in this workflow rather than its own so it can depend on the
  # checks: a separate workflow triggered by the same tag would run *beside*
  # them, and could push an image whose lint or tests had just failed.
  publish:
    needs: [lint, build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated, hence slow — acceptable on a tag, unlike on every
      # pull request.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is not listed: the default `latest=auto` flavor already adds it
      # for a non-prerelease semver tag, and only for one.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Reads the amd64 layers the `docker` job just built, when the Actions
      # cache makes them reachable from this ref, and keeps its own multi-arch
      # cache in a separate scope.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=release
