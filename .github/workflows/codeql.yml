name: "Code scanning"

# Static analysis whose findings go to the Security tab (code scanning),
# visible only to collaborators with write access, rather than to the public
# job log: CodeQL for the source and the workflows, zizmor for the workflows
# again — it knows GitHub Actions pitfalls CodeQL does not.
#
# The file keeps its codeql.yml name: code scanning can take a renamed
# workflow for a new configuration and leave the old one behind, stale.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "33 4 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: &upload-results
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript-typescript"]
    steps:
      - &checkout
        name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # Template injection, credentials left behind by checkout, unpinned or
  # known-vulnerable actions, impostor commits… Rules are tuned in
  # .github/zizmor.yml. It runs on every change rather than only on workflow
  # ones: a `paths` filter applies to the whole workflow, CodeQL included, and
  # the run takes seconds. The weekly run catches what the online audits learn
  # in the meantime.
  zizmor:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: *upload-results
    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
