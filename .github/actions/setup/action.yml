name: Setup toolchain
description: Install pnpm, the Node version pinned in .mise.toml, and one workspace package's dependencies.

inputs:
  package:
    description: Workspace package whose dependencies are installed.
    default: omni-bot

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
    - name: Read Node version from .mise.toml
      id: node-version
      shell: bash
      run: echo "version=$(grep '^node = ' .mise.toml | sed 's/node = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --filter "${{ inputs.package }}"
