name: Set up Node.js and pnpm
description: >-
  Installs Node and pnpm at the versions pinned in .mise.toml, restores the
  pnpm store cache, then installs the dependencies.

runs:
  using: composite
  steps:
    # Only node and pnpm: the other tools listed in .mise.toml are for local
    # development (pitchfork, gh) or installed by the job that needs them
    # (osv-scanner, git-cliff).
    #
    # zizmor flags both caches below (cache-poisoning) in a workflow that also
    # publishes. A run reads only the caches of its own ref and of master, and
    # a pull request's stay scoped to it: no tag or master run, such as the
    # mutation job that sends its report to the Stryker Dashboard, reads them.
    - name: Set up Node.js and pnpm
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7 # zizmor: ignore[cache-poisoning]
      with:
        install_args: node pnpm

    # No node-version: setup-node keeps the Node mise put on the PATH and is
    # only here for its pnpm store cache.
    - name: Cache the pnpm store
      uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning]
      with:
        cache: "pnpm"

    # No --filter: it does not narrow the install here — the bot is the
    # workspace root, and its dependencies come along either way.
    - name: Install dependencies
      shell: bash
      run: pnpm ci
