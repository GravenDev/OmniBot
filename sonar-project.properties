# SonarCloud analysis, run by the `sonarcloud` job of .github/workflows/ci.yml
# on the coverage report the `build` job leaves (coverage/lcov.info).
#
# SonarCloud now analyses the whole repository and ignores sonar.sources,
# sonar.tests and sonar.test.inclusions: the scope is narrowed by exclusions
# alone. In: the code of src/, scripts/, lint/ and bootstrap/ (the
# environment check the container runs at start). Out: tests (their
# duplication and smells are not the bot's), the generated Prisma client,
# migrations, test fakes, previews, images, the documentation site (docs/,
# a project of its own), and the build and CI files (Dockerfile, compose,
# bake, workflows, root configs), which zizmor and Trivy already check.
sonar.projectKey=GravenDev_OmniBot
sonar.organization=gravendev

# Every file analysed here must be measured by vitest (coverage.include in
# vitest.config.ts) or listed in sonar.coverage.exclusions, or it reads 0 %.
sonar.exclusions=src/generated/**,src/prisma/migrations/**,src/lib/testing.ts,src/**/*.d.ts,**/*.test.ts,**/*.preview.ts,**/assets/**,docs/**,.github/**,docker/**,Dockerfile,docker-bake.hcl,compose*.yaml,*.config.ts,*.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The lint rules run inside oxlint, a native binary that Node's coverage
# cannot follow: tested (lint/omnibot.test.ts) but never counted, so their
# coverage would read 0 %. Still analysed for bugs and smells.
sonar.coverage.exclusions=lint/omnibot.js

# The dev scripts call git and node by name, through PATH (S4036). They run
# on a developer's machine or a CI runner, where whoever can change PATH
# already runs code; an absolute path would break between /usr/bin and
# Homebrew or mise. The bot's code (src/) starts no process, and keeps the
# rule.
sonar.issue.ignore.multicriteria=path
sonar.issue.ignore.multicriteria.path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=scripts/**
