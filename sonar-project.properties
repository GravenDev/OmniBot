# SonarCloud analysis, run by the `sonarcloud` job of .github/workflows/ci.yml
# on the coverage report the `build` job leaves (coverage/lcov.info).
sonar.projectKey=GravenDev_OmniBot
sonar.organization=gravendev

sonar.sources=src,scripts,lint
sonar.tests=src,scripts,lint
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=src/generated/**,src/prisma/migrations/**,src/lib/testing.ts,**/*.test.ts,**/*.preview.ts,**/assets/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
